services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portsight}
    volumes:
      - pgdata_beta:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portsight}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/shunsing22/port-sight/backend:${PORT_SIGHT_VERSION:-beta}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portsight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portsight}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      STRIP_SWITCH_DOMAIN: ${STRIP_SWITCH_DOMAIN:-false}
      POLL_SCHEDULE_HOUR: ${POLL_SCHEDULE_HOUR:-2}
      POLL_SCHEDULE_MINUTE: ${POLL_SCHEDULE_MINUTE:-0}
      PORT_SIGHT_CHANNEL: beta
      FLOW_URL: http://flow:8085
    volumes:
      - backups_beta:/app/backups

  frontend:
    image: ghcr.io/shunsing22/port-sight/frontend:${PORT_SIGHT_VERSION:-beta}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro

  # NetFlow/IPFIX/sFlow collector (v2.13 WP N2) -- decodes flows in memory
  # only, never writes to disk or the database. Not a `depends_on` of
  # backend: the app must start and run normally when this container is
  # absent or removed. Default port 2056 (not 2055): the prod and beta
  # stacks share the host IP, so each exporter lists the host twice with
  # the two ports.
  flow:
    image: ghcr.io/shunsing22/port-sight/flow:${PORT_SIGHT_VERSION:-beta}
    restart: unless-stopped
    ports:
      - "${FLOW_PORT:-2056}:2055/udp"
    environment:
      PORT_SIGHT_VERSION: ${PORT_SIGHT_VERSION:-beta}
    # See docker-compose.prod.yml's flow service for why these were raised
    # from 1g/1.0 in v2.13.13.
    mem_limit: ${FLOW_MEM_LIMIT:-2g}
    cpus: ${FLOW_CPUS:-2.0}

volumes:
  pgdata_beta:
  backups_beta:
