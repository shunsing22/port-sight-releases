services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portsight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portsight}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/shunsing22/port-sight/backend:${PORT_SIGHT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portsight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portsight}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      STRIP_SWITCH_DOMAIN: ${STRIP_SWITCH_DOMAIN:-false}
      POLL_SCHEDULE_HOUR: ${POLL_SCHEDULE_HOUR:-2}
      POLL_SCHEDULE_MINUTE: ${POLL_SCHEDULE_MINUTE:-0}
      FLOW_URL: http://flow:8085
    volumes:
      - backups:/app/backups

  frontend:
    image: ghcr.io/shunsing22/port-sight/frontend:${PORT_SIGHT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro

  # NetFlow/IPFIX/sFlow collector (v2.13 WP N2) -- decodes flows in memory
  # only, never writes to disk or the database. Not a `depends_on` of
  # backend: the app must start and run normally when this container is
  # absent or removed (existing installs before the updater adds it, or a
  # customer who removes it).
  flow:
    image: ghcr.io/shunsing22/port-sight/flow:${PORT_SIGHT_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${FLOW_PORT:-2055}:2055/udp"
    environment:
      # Only so the collector can log and report its own version -- it has
      # no other use for it. Reads "unknown" when unset.
      PORT_SIGHT_VERSION: ${PORT_SIGHT_VERSION:-latest}
    # v2.13.13: was 1g/1.0, which is demonstrably too small past a single
    # busy exporter. On the owner's production box, a Catalyst 9606 plus two
    # FTDs sat at 110% of the one-core cap; goflow2's output queue then grew
    # until the container hit 1 GiB and the kernel OOM-killed goflow2
    # (`exited (code=-9)`), losing every NetFlow v9 template and putting the
    # collector into a restart loop. Override per install with FLOW_MEM_LIMIT
    # / FLOW_CPUS in .env.
    mem_limit: ${FLOW_MEM_LIMIT:-2g}
    cpus: ${FLOW_CPUS:-2.0}

volumes:
  pgdata:
  backups:
